name: Build and Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [trigger-workflow]

permissions: write-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash

jobs:
  deploy:
    name: Build and Deploy
    runs-on: [self-hosted, linux, x64, yohaku]
    if: ${{ github.event.head_commit.message != 'Update hash file' }}

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read HASH_FILE content
        id: read_hash
        shell: bash
        run: |
          content=$(cat ${{ env.HASH_FILE }} 2>/dev/null || true)
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: Innei-dev/Yohaku
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          path: source

      - name: Checkout LFS objects
        working-directory: source
        run: git lfs checkout

      - name: Compare current hash
        id: compare
        working-directory: source
        env:
          FILE_HASH: ${{ steps.read_hash.outputs.hash_content }}
        shell: bash
        run: |
          current_hash=$(git rev-parse --short HEAD)
          echo "current_hash=$current_hash" >> "$GITHUB_OUTPUT"
          echo "File Hash: $FILE_HASH"
          echo "Current Git Hash: $current_hash"
          if [ "$FILE_HASH" = "$current_hash" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Hashes match. Stopping workflow."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Hashes do not match. Continuing workflow."
          fi

      - name: Run pnpm/action-setup@v2
        if: steps.compare.outputs.skip != 'true'
        uses: pnpm/action-setup@v2

      - name: Use Node.js lts/*
        if: steps.compare.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.compare.outputs.skip != 'true'
        working-directory: source
        run: pnpm install

      - name: Build project
        if: steps.compare.outputs.skip != 'true'
        working-directory: source
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
        run: sh ./ci-release-build.sh

      - name: Install PM2 config
        if: steps.compare.outputs.skip != 'true'
        run: |
          install -m 644 pm2/ecosystem.config.js $HOME/shiro/ecosystem.config.js
          install -m 755 rollback.sh $HOME/shiro/rollback.sh

      - name: Deploy locally
        if: steps.compare.outputs.skip != 'true'
        working-directory: source
        shell: bash
        run: |
          set -e
          source "$HOME/.bashrc" || true
          basedir=$HOME/shiro
          workdir=$basedir/${{ github.run_number }}
          mkdir -p "$workdir"
          mkdir -p "$basedir/.cache"
          cp assets/release.zip "$workdir/release.zip"
          cd "$workdir"
          unzip -qq -o "$workdir/release.zip"
          rm -rf "$workdir/standalone/apps/web/.env"
          ln -sfn "$basedir/.env" "$workdir/standalone/apps/web/.env"
          export NEXT_SHARP_PATH=$(npm root -g)/sharp
          ln -sfn "$workdir/standalone/apps/web/server.js" "$basedir/server.js"
          mkdir -p "$workdir/standalone/apps/web/.next"
          rm -rf "$workdir/standalone/apps/web/.next/cache"
          ln -sfn "$basedir/.cache" "$workdir/standalone/apps/web/.next/cache"
          cd "$basedir"
          if pm2 describe Shiroi >/dev/null 2>&1; then
            pm2 reload ecosystem.config.js --update-env
          else
            pm2 start ecosystem.config.js --update-env
          fi
          rm -f "$workdir/release.zip"
          pm2 save
          echo "Deployed successfully"

      - name: Update hash file
        if: steps.compare.outputs.skip != 'true'
        run: echo "${{ steps.compare.outputs.current_hash }}" > ${{ env.HASH_FILE }}

      - name: Commit hash file
        if: steps.compare.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.HASH_FILE }}
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update hash file"
          git push
